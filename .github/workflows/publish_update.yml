name: Release new version on NPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic Version'
        required: true

jobs:
  # Publish the updated package to NPM
  bump-version:
    name: Update the semantic version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
 
      # In order to make a commit, we need to initialize a user.
      - name: Initialize mandatory git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email noreply@github.com

      - name: Merge develop -> master
        uses: devmasx/merge-branch@v1.4.0
        with:
          type: now
          # message: Merge branch 'develop' into master
          from_branch: develop
          target_branch: master
          github_token: ${{ github.token }}

      - uses: actions/setup-node@v2
        with:
          node-version: 14

      - name: npm version
        run: npm version ${{ github.event.inputs.version }}

      - name: Update changelog
        uses: thomaseizinger/keep-a-changelog-new-release@1.1.0
        with:
          version: ${{ github.event.inputs.version }}

      - name: Commit changelog
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Prepare release ${{ github.event.inputs.version }}"

  publish-boilerplate:
    name: Update package on NPM.js
    runs-on: ubuntu-latest
    needs: bump-version
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: 14
          registry-url: https://registry.npmjs.org/
      - run: npm publish dist/n7-boilerplate-common --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}

  # Update develop with the new package version
  sync-develop:
    name: Sync the new version to develop
    runs-on: ubuntu-latest
    needs: publish-boilerplate
    steps:
      - uses: actions/checkout@master

      - name: Merge master -> develop
        uses: devmasx/merge-branch@v1.4.0
        with:
          type: now
          # message: Merge branch 'master' into develop
          from_branch: master
          target_branch: develop
          github_token: ${{ github.token }}
