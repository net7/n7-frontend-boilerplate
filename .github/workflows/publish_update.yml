name: Release new version on NPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic Version'
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Initialize mandatory git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email noreply@github.com

      - name: Merge develop into master
        run: |
          git fetch origin develop
          git merge origin/develop --no-ff -X theirs -m "Merge develop into master for release ${{ github.event.inputs.version }}"

      - name: Bump version
        run: |
          npm install
          git diff --quiet && git diff --staged --quiet || (git add . && git commit -m "Commit changes from npm install")
          npm version ${{ github.event.inputs.version }}

      - name: Update changelog
        uses: thomaseizinger/keep-a-changelog-new-release@1.3.0
        with:
          tag: ${{ github.event.inputs.version }}

      - name: Push to master
        run: |
          git add .
          git commit -m "Update changelog to ${{ github.event.inputs.version }}"
          git push origin master
          git push origin ${{ github.event.inputs.version }}

      - name: Publish to npm
        run: |
          npm run build
          VERSION="${{ github.event.inputs.version }}"
          TAG=$(node -e "const v='$VERSION'; console.log(v.includes('-') ? 'next' : 'latest')")
          npm publish ./dist/n7-boilerplate-common --access public --tag $TAG
          npm publish ./dist/n7-boilerplate-muruca --access public --tag $TAG
          npm publish ./dist/n7-boilerplate-arianna --access public --tag $TAG
          npm publish ./dist/n7-boilerplate-dataviz --access public --tag $TAG

      - name: Create PR to sync develop
        uses: repo-sync/pull-request@v2
        with:
          source_branch: "master"
          destination_branch: "develop"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: "Sync develop with release ${{ github.event.inputs.version }}"
