name: Release new version on NPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic Version'
        required: true

jobs:
  # Publish the updated package to NPM
  bump-version:
    name: Update the semantic version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: master
 
      - name: Fast-forward master to develop
        run: |
          git merge origin/develop --ff-only
          git push

      - uses: actions/setup-node@v2
        with:
          node-version: 14

      - name: Initialize mandatory git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email noreply@github.com

      - name: npm version
        run: |
          npm install
          npm version ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Update changelog
        uses: thomaseizinger/keep-a-changelog-new-release@1.3.0
        with:
          tag: ${{ github.event.inputs.version }}

      - name: Push changes
        run: |
          git add .
          git commit -m "Update changelog to ${{ github.event.inputs.version }}"
          git push          

      - name: Push to npm
        run: |
          npm install
          npm run build
          npm publish dist/n7-boilerplate-common --access public
          npm publish dist/n7-boilerplate-muruca --access public
          npm publish dist/n7-boilerplate-arianna --access public
          npm publish dist/n7-boilerplate-dataviz --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}

  # Update develop with the new package version
  sync-develop:
    name: Sync the new version to develop
    runs-on: ubuntu-latest
    needs: bump-version
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: master

      - name: Create Pull Request
        uses: repo-sync/pull-request@v2
        with:
          source_branch: "master"
          destination_branch: "develop"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: "Update develop to ${{ github.event.inputs.version }}"
