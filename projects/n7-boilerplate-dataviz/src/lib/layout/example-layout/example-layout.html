<div class="dv-example-layout" id="example-layout">
  <h2>Grid component</h2>
  <p>Four columns equal width</p>
  <n7-grid templateColumns="1fr 1fr 1fr 1fr" classes="custom-grid">
    <div class="n7-grid__item">
      <img src="http://placekitten.com/300/200" />
    </div>
    <div class="n7-grid__item">
      <img src="http://placekitten.com/300/201" />
    </div>
    <div class="n7-grid__item">
      <img src="http://placekitten.com/300/199" />
    </div>
    <div class="n7-grid__item">
      <img src="http://placekitten.com/300/198" />
    </div>
    <div class="n7-grid__item">
      <img src="http://placekitten.com/300/197" />
    </div>
    <div class="n7-grid__item">
      <img src="http://placekitten.com/300/195" />
    </div>
    <div class="n7-grid__item">
      <img src="http://placekitten.com/300/203" />
    </div>
    <div class="n7-grid__item">
      <img src="http://placekitten.com/300/204" />
    </div>
  </n7-grid>

  <br />

  <p>Two columns, first is 33%</p>
  <n7-grid templateColumns="33% 1fr" classes="custom-grid">
    <div class="n7-grid__item">
      <img src="http://placekitten.com/300/600" />
    </div>
    <div class="n7-grid__item">
      <img src="http://placekitten.com/600/600" />
    </div>
  </n7-grid>

  <p>Nested grids</p>
  <n7-grid templateColumns="33% 1fr" classes="custom-grid">
    <div class="n7-grid__item">
      <img src="http://placekitten.com/300/500" />
    </div>
    <div class="n7-grid__item">
      <n7-grid templateColumns="1fr 1fr 1fr 1fr" classes="custom-grid">
        <div class="n7-grid__item">
          <img src="http://placekitten.com/200/200" />
        </div>
        <div class="n7-grid__item">
          <img src="http://placekitten.com/200/201" />
        </div>
        <div class="n7-grid__item">
          <img src="http://placekitten.com/200/199" />
        </div>
        <div class="n7-grid__item">
          <img src="http://placekitten.com/200/198" />
        </div>
        <div class="n7-grid__item">
          <img src="http://placekitten.com/200/197" />
        </div>
        <div class="n7-grid__item">
          <img src="http://placekitten.com/200/195" />
        </div>
        <div class="n7-grid__item">
          <img src="http://placekitten.com/200/203" />
        </div>
        <div class="n7-grid__item">
          <img src="http://placekitten.com/200/204" />
        </div>
      </n7-grid>
    </div>
  </n7-grid>

  <h2>Container component</h2>
  <p>Full width container</p>
  <n7-container classes="big-container-class">Container content</n7-container>
  <n7-container classes="big-container-class" fluid="true">
    Container fluid content
  </n7-container>

  <h2>Combined components</h2>
  <p>Container with grids inside</p>
  <n7-container classes="big-container-class">
    <n7-grid templateColumns="33% 1fr" classes="custom-grid">
      <div class="n7-grid__item">
        <img src="http://placekitten.com/300/500" />

      <div class="n7-grid__item">
