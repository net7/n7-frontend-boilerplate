<div *ngIf="lb.dataSource.facets" class="mr-search-facets {{ lb.dataSource.facets.classes || '' }}">
    <div *ngFor="let section of lb.dataSource.facets.sections" class="mr-search-facets__section {{ section.classes || '' }}">
        <n7-facet-header
        [data]="lb.widgets[section.header.id].ds.out$ | async"
        [emit]="lb.widgets[section.header.id].emit"
        ></n7-facet-header>

        <div [hidden]="!lb.widgets[section.header.id].ds.isOpen()" class="mr-search-facets__wrapper">
            <div *ngFor="let input of section.inputs" class="mr-search-facets__input {{ input.classes || '' }}">
                <ng-container [ngSwitch]="input.type">
    
                    <!-- INPUT TEXT -->
                    <n7-input-text 
                    *ngSwitchCase="'text'"
                    [data]="lb.widgets[input.id].ds.out$ | async"
                    [emit]="lb.widgets[input.id].emit"></n7-input-text>
    
                    <!-- INPUT CHECKBOX -->
                    <n7-input-checkbox 
                    *ngSwitchCase="'checkbox'"
                    [data]="lb.widgets[input.id].ds.out$ | async"
                    [emit]="lb.widgets[input.id].emit"></n7-input-checkbox>
                    
                    <!-- INPUT SELECT -->
                    <n7-input-select 
                    *ngSwitchCase="'select'"
                    [data]="lb.widgets[input.id].ds.out$ | async"
                    [emit]="lb.widgets[input.id].emit"></n7-input-select>
                    
                    <!-- INPUT LINK -->
                    <n7-input-link 
                    *ngSwitchCase="'link'"
                    [data]="lb.widgets[input.id].ds.out$ | async"
                    [emit]="lb.widgets[input.id].emit"></n7-input-link>

                    <!-- INPUT LINKMULTI -->
                    <n7-input-link 
                    *ngSwitchCase="'linkMulti'"
                    [data]="lb.widgets[input.id].ds.out$ | async"
                    [emit]="lb.widgets[input.id].emit"></n7-input-link>
                
                </ng-container>
            </div>
        </div>
        
        
    </div>
</div>
