<div class="mr-resource mr-layout" *ngIf="lb.dataSource && lb.dataSource.pageConfig">
    <!-- RESOURCE LAYOUT CONTENT -->
    <ng-container [ngSwitch]="layoutState.get$('content') | async">
        <!-- loading -->
        <ng-container *ngSwitchCase="'LOADING'">
            loading...
        </ng-container>

        <!-- error -->
        <ng-container *ngSwitchCase="'ERROR'">
            error!
        </ng-container>

        <!-- success -->
        <ng-container *ngSwitchCase="'SUCCESS'">
            <ng-container *ngIf="lb.dataSource.pageConfig.sections as sections">
                <!-- Pass the list of blocks to render to the block template -->
                <div class="mr-resource__top">
                    <ng-container *ngTemplateOutlet="blocks; context: { $implicit: sections.top }"></ng-container>
                </div>
                <div class="mr-resource__content mr-side-margin">
                    <ng-container *ngTemplateOutlet="blocks; context: { $implicit: sections.content }"></ng-container>
                </div>
            </ng-container>
        </ng-container>

    </ng-container>
</div>

<ng-template #blocks let-list>
    <section *ngFor="let section of list" class="{{ 'mr-resource__section mr-resource__' + section.type }}">
        <ng-container [ngSwitch]="section.type">

            <!-- TABS -->
            <ng-container *ngSwitchCase="'tabs'">
                <ng-container *ngFor="let tab of lb.widgets[section.id].ds.out$ | async">
                    <n7-anchor-wrapper [data]="tab.anchor" [classes]="tab.classes">
                        <span class="n7-btn n7-btn-light">{{ tab.label }}</span>
                    </n7-anchor-wrapper>
                </ng-container>
            </ng-container>

            <!-- INNER TITLE -->
            <ng-container *ngSwitchCase="'title'">
                <div class="mr-resource__title-content mr-side-margin">
                    <n7-inner-title [data]="lb.widgets[section.id].ds.out$ | async"
                        [emit]="lb.widgets[section.id].emit">
                    </n7-inner-title>
                </div>
            </ng-container>

            <!-- IMAGE VIEWER -->
            <ng-container *ngSwitchCase="'viewer'">
                <n7-image-viewer [data]="lb.widgets[section.id].ds.out$ | async" [emit]="lb.widgets[section.id].emit">
                </n7-image-viewer>
            </ng-container>

            <!-- METADATA VIEWER -->
            <ng-container *ngSwitchCase="'metadata'">
                <div class="mr-resource__metadata-content">
                    <h3 *ngIf="section.title" class="mr-resource__section-title mr-resource__metadata-title">
                        {{ section.title }}
                    </h3>
                    <mr-read-more [data]="{ limit: 130 }">
                        <n7-metadata-viewer [data]="lb.widgets[section.id].ds.out$ | async"
                            [emit]="lb.widgets[section.id].emit">
                        </n7-metadata-viewer>
                    </mr-read-more>
                </div>
            </ng-container>

            <!-- COLLECTION -->
            <ng-container *ngSwitchCase="'collection'">
                <div *ngIf="lb.widgets[section.id].ds.out$ | async as collection$" class="mr-layout__maxwidth mr-items-preview">
                    <!-- <n7-inner-title [data]="(lb.widgets[section.id].ds.out$ | async)?.header"
                        [emit]="lb.widgets[section.id].emit">
                    </n7-inner-title> -->
                    <h3 *ngIf="section.title" class="mr-resource__section-title mr-resource__collection-title">
                        {{ section.title }}
                    </h3>
                    <div class="{{ section.grid ? 'n7-grid-' + section.grid : '' }}">
                        <n7-item-preview *ngFor="let item of (collection$ || {})?.items"
                            [data]="item" [emit]="lb.widgets[section.id].emit">
                        </n7-item-preview>
                    </div>
                </div>
            </ng-container>

            <!-- ITEM PREVIEW -->
            <ng-container *ngSwitchCase="'preview'">
                <h3 *ngIf="section.title" class="mr-resource__section-title mr-resource__preview-title">
                    {{ section.title }}
                </h3>
                <n7-item-preview [data]="lb.widgets[section.id].ds.out$ | async" [emit]="lb.widgets[section.id].emit">
                </n7-item-preview>
            </ng-container>

            <!-- TEXT VIEWER -->
            <ng-container *ngSwitchCase="'text-viewer'">
                <h3 *ngIf="section.title" class="mr-resource__section-title mr-resource__text-viewer-title">
                    {{ section.title }}
                </h3>
                <div class="text-viewer__mock">n7-text-viewer</div>
            </ng-container>

            <!-- INFO BOX -->
            <ng-container *ngSwitchCase="'info-box'">
                <h3 *ngIf="section.title" class="mr-resource__section-title mr-resource__info-box-title">
                    {{ section.title }}
                </h3>
                <div class="info-box__mock">info-box</div>
            </ng-container>

            <!-- BREADCRUMBS -->
            <ng-container *ngSwitchCase="'breadcrumbs'">
                <n7-breadcrumbs [data]="lb.widgets[section.id].ds.out$ | async">
                </n7-breadcrumbs>
            </ng-container>
        </ng-container>
    </section>
</ng-template>
