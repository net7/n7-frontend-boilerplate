<div class="mr-static mr-layout" *ngIf="lb.dataSource">
    <!-- STATIC LAYOUT CONTENT -->
    <ng-container [ngSwitch]="layoutState.get$('content') | async">
        <!-- loading -->
        <ng-container *ngSwitchCase="'LOADING'">
            loading...
        </ng-container>

        <!-- error -->
        <ng-container *ngSwitchCase="'ERROR'">
            error!
        </ng-container>

        <!-- success -->
        <ng-container *ngSwitchCase="'SUCCESS'">
            <h1 class="mr-static__title mr-generated-title-WP">{{lb.dataSource.html.title}}</h1>
            <div class="mr-static__content mr-wp-content" [innerHTML]="lb.dataSource.html.body | keepHtml"></div>
        </ng-container>
    
    </ng-container>
</div>
