<div class="mr-static mr-layout"
     *ngIf="lb.dataSource"
     [ngClass]="{
        'is-loading': ( layoutState.get$('content') | async ) == 'LOADING',
        'is-error': ( layoutState.get$('content') | async ) == 'ERROR'
      }">
    <!-- STATIC LAYOUT CONTENT -->
    <ng-container [ngSwitch]="layoutState.get$('content') | async">
        <!-- loading -->
        <ng-container *ngSwitchCase="'LOADING'">
            <div class="mr-layout__loader">
                <n7-loader></n7-loader>
            </div>
        </ng-container>

        <!-- error -->
        <ng-container *ngSwitchCase="'ERROR'">
            <div class="mr-layout__error">
                <h2>{{ lb.dataSource.errorTitle }}</h2>
                <p>{{ lb.dataSource.errorDescription }}</p>
            </div>
        </ng-container>

        <!-- success -->
        <ng-container *ngSwitchCase="'SUCCESS'">
            <div class="mr-static__top">
                <h1 class="mr-static__title mr-generated-title-WP">{{lb.dataSource.title}}</h1>
                <div class="mr-static__metadata">
                    <n7-metadata-viewer 
                    [data]="lb.widgets['mr-static-metadata'].ds.out$ | async">
                    </n7-metadata-viewer>
                </div>
            </div>
            
            <div class="mr-static__content mr-wp-content" [innerHTML]="lb.dataSource.content | keepHtml"></div>
        </ng-container>
    
    </ng-container>
</div>
