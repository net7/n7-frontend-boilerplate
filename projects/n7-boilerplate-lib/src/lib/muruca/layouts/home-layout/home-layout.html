<div class="mr-home mr-layout" *ngIf="lb.dataSource">
    
    <section class="mr-layout__fullwidth">
        <!-- TODO: Replace with <n7-carousel-component> -->
        <div style="
        height: 300px;
        border: 1px solid #dddddd;
        line-height: 300px;
        text-align: center;">
            <em>n7-carousel-component</em>
        </div>
    <!-- ========================================== -->
    </section>
    
    <section class="mr-layout__maxwidth">
        <n7-inner-title [data]="lb.widgets['mr-res-header'].ds.out$ | async" [class]="try"></n7-inner-title>
        <div class="n7-grid-4">
            <n7-item-preview
                *ngFor="let resource of (lb.widgets['mr-resources'].ds.out$ | async)"
                [data]="resource"
                [class]="try">
            </n7-item-preview>
        </div>
    </section>
    
    <section class="mr-layout__fullwidth">
        <n7-hero [data]="lb.widgets['mr-hero'].ds.out$ | async">
        </n7-hero>    
    </section>
    
    <section class="mr-layout__maxwidth">
        <n7-inner-title [data]="lb.widgets['mr-coll-header'].ds.out$ | async"></n7-inner-title>
        <div class="n7-grid-4">
            <n7-item-preview
                *ngFor="let collection of (lb.widgets['mr-collections'].ds.out$ | async)" 
                [data]="collection">
            </n7-item-preview>
        </div>
    </section>
    
</div>
