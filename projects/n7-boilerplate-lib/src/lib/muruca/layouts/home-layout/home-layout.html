<div class="mr-home mr-layout"
     *ngIf="lb.dataSource"
     [ngClass]="{
        'is-loading': ( layoutState.get$('content') | async ) == 'LOADING',
        'is-error': ( layoutState.get$('content') | async ) == 'ERROR'
      }">
    <!-- HOME CONTENT -->
    <ng-container [ngSwitch]="layoutState.get$('content') | async">
        <!-- loading -->
        <ng-container *ngSwitchCase="'LOADING'">
            <div class="mr-layout__loader">
                <n7-loader></n7-loader>
            </div>
        </ng-container>

        <!-- error -->
        <ng-container *ngSwitchCase="'ERROR'">
            <div class="mr-layout__error">
                <h2>{{ lb.dataSource.errorTitle }}</h2>
                <p>{{ lb.dataSource.errorDescription }}</p>
            </div>
        </ng-container>

        <!-- success -->
        <ng-container *ngSwitchCase="'SUCCESS'">
            <section *ngFor="let section of lb.dataSource.pageConfig.sections" class="{{ 'mr-layout__' + section.type }}">
                <ng-container [ngSwitch]="section.type">
        
                    <!-- SLIDER -->
                    <ng-container *ngSwitchCase="'slider'">
                        <n7-carousel 
                        [data]="lb.widgets[section.id].ds.out$ | async"
                        [emit]="lb.widgets[section.id].emit">
                        </n7-carousel> 
                    </ng-container>
        
                    <!-- COLLECTION -->
                    <ng-container *ngSwitchCase="'collection'">
                        <div class="mr-layout__maxwidth mr-items-preview">
                            <n7-inner-title 
                            [data]="(lb.widgets[section.id].ds.out$ | async)?.header"
                            [emit]="lb.widgets[section.id].emit">
                            </n7-inner-title>
                            <div class="{{ section.grid ? 'n7-grid-' + section.grid : '' }}">
                                <n7-item-preview
                                *ngFor="let item of (lb.widgets[section.id].ds.out$ | async)?.items"
                                [data]="item"
                                [emit]="lb.widgets[section.id].emit">
                                </n7-item-preview>
                            </div>
                        </div>
                    </ng-container>
        
                    <!-- HERO -->
                    <ng-container *ngSwitchCase="'hero'">
                        <n7-hero 
                        [data]="lb.widgets[section.id].ds.out$ | async"
                        [emit]="lb.widgets[section.id].emit">
                        </n7-hero> 
                    </ng-container>
                
                </ng-container>
            </section>
        </ng-container>

    </ng-container>
</div>
