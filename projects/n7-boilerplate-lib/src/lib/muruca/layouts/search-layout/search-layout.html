<div class="mr-search mr-layout"
     *ngIf="lb.dataSource">
    <section class="mr-layout__maxwidth">

        <div class="mr-search__title">
            <n7-inner-title
            [data]="lb.widgets['mr-search-page-title'].ds.out$ | async">
            </n7-inner-title>
        </div>
        
        <div class="mr-search__results-content">
            <aside class="mr-search__facets">
                <div class="filter-section">
                    <h2>{{ lb.dataSource.pageConfig['facets-title'] }}</h2>
                    <mr-search-facets-layout 
                    [data]="lb.dataSource.facetsConfig"
                    [hostEmit$]="hostEmit$"
                    [guestEmit$]="guestEmit$">
                    </mr-search-facets-layout>
                </div>
            </aside>
            <div class="mr-search__results-wrapper">
                <div class="mr-search__results-info">
                    <n7-inner-title
                    [data]="lb.widgets['mr-search-results-title'].ds.out$ | async">
                    </n7-inner-title>
                </div>
                <div class="mr-search__results-filters">
                    #TODO: Filter, when active
                </div>
                <main class="mr-search__results">
                    <n7-item-preview *ngFor="let item of (lb.widgets['mr-search-results'].ds.out$ | async)"
                    [data]="item">
                    </n7-item-preview>
                </main>
            </div>
        </div>

    </section>
</div>
