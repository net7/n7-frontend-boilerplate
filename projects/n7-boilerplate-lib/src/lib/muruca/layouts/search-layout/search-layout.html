<div class="search-layout"
     *ngIf="lb.dataSource">
    <div class="search-wrapper">
        <!-- SIDEBAR -->
        <div class="filter-section">
            <h2>Filtra i risultati</h2>
            <mr-search-facets-layout 
            [data]="lb.dataSource.facetsConfig"
            [emit$]="emit$">
            </mr-search-facets-layout>
        </div>
        <!-- RESULTS -->
        <n7-item-preview *ngFor="let resource of (lb.widgets['mr-resources'].ds.out$ | async)"
                         [data]="resource">
        </n7-item-preview>
    </div>
</div>
