<div class="mr-advanced-search-layout mr-layout">
    <ng-container *ngFor="let group of lb.dataSource.formConfig.groups; index as $i">
        <hr *ngIf="$i > 0" [ngStyle]="{ margin: '50px 0' }" />
        <mr-form [form]="lb.dataSource.form" [group]="group || null">
            <ng-template let-type="type" let-input="input">
                <ng-container [ngSwitch]="type">
                    
                    <n7-tag *ngSwitchCase="'tag'" 
                        [data]="input.ds.out$ | async"
                        [emit]="input.emit"></n7-tag>

                </ng-container>
            </ng-template>
        </mr-form>
    </ng-container>
    
    <div class="mr-advanced-search-layout__actions">
        <a class="n7-btn n7-btn-danger" (click)="lb.eventHandler.emitInner('reset')">RESET</a>
        <a class="n7-btn n7-btn-info" (click)="lb.eventHandler.emitInner('submit')">SUBMIT</a>
    </div>
</div>
