<div *ngIf="data" class="mr-form-wrapper mr-form-wrapper-accordion">
    <ng-container *ngFor="let group of data.form.config.groups; index as $i">
        <div class="mr-form-wrapper__header">
            <n7-facet-header
            *ngIf="group.options"
            [data]="group.options"
            [emit]="fakeEmit"
            ></n7-facet-header>
        </div>

        <div *ngIf="group.options.isOpen" class="mr-form-wrapper__content" [attr.id]="group.id">
            <mr-form [form]="data.form" [group]="group">
                <!-- CUSTOM INPUTS -->
                <!-- <ng-template let-type="type" let-input="input">
                    <ng-container [ngSwitch]="type">
                        
                        <n7-tag *ngSwitchCase="'tag'" 
                            [data]="input.ds.out$ | async"
                            [emit]="input.emit"></n7-tag>
    
                    </ng-container>
                </ng-template> -->
            </mr-form>
        </div>
    </ng-container>
    
    <div class="mr-form-wrapper__actions">
        <a class="n7-btn n7-btn-danger" (click)="onReset()">RESET</a>
        <a class="n7-btn n7-btn-info" (click)="onSubmit()">SUBMIT</a>
    </div>
</div>
