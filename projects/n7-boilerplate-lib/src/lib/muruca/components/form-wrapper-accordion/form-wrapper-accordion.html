<div *ngIf="data" class="mr-form-wrapper-accordion">
    <ng-container *ngFor="let group of data.form.config.groups; index as $i">
        <div *ngIf="group.options && (group.options.showHeader !== false)" 
            class="mr-form-wrapper-accordion__header">
            <n7-facet-header
                [data]="group.options"
                [emit]="fakeEmit"
            ></n7-facet-header>
        </div>

        <div *ngIf="group.options.isOpen" class="mr-form-wrapper-accordion__content" [attr.id]="group.id">
            <mr-form [form]="data.form" [group]="group">
                <!-- CUSTOM INPUTS -->
                <!-- <ng-template let-type="type" let-input="input">
                    <ng-container [ngSwitch]="type">
                        
                        <n7-tag *ngSwitchCase="'tag'" 
                            [data]="input.ds.out$ | async"
                            [emit]="input.emit"></n7-tag>
    
                    </ng-container>
                </ng-template> -->
            </mr-form>
        </div>
    </ng-container>
    
    <div class="mr-form-wrapper-accordion__actions">
        <a *ngIf="data.form.config.resetButton" 
            class="n7-btn n7-btn-xl n7-btn-danger" 
            (click)="onReset()">{{ data.form.config.resetButton.label }}</a>
        <a *ngIf="data.form.config.submitButton" 
            class="n7-btn n7-btn-cta n7-btn-xl n7-btn-info" 
            (click)="onSubmit()">{{ data.form.config.submitButton.label }}</a>
    </div>
</div>
