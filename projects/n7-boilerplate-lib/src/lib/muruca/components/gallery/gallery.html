<div *ngIf="data" class="mr-gallery">
    <ul class="mr-gallery__items {{ grid ? 'n7-grid-' + grid : '' }}">
        <li *ngFor="let item of data.items" class="mr-gallery__item">
            <a (click)="onClick(item.payload)" class="mr-gallery__link">
                <img [src]="item.thumbSrc" [alt]="item.title" class="mr-gallery__image">
            </a>
        </li>
    </ul>
    <div *ngIf="data.selected" class="mr-gallery__zoom-wrapper">
        <div class="mr-gallery__zoom-close">
            <a class="mr-gallery__close-link" (click)="onClose()"><span class="n7-icon-close"></span></a>
        </div>
        <div class="mr-gallery__zoom-image-wrapper">
            <img [src]="data.selected.fullSrc" [alt]="data.selected.title" class="mr-gallery__zoom-image">
        </div>
    </div>
</div>
