<div *ngIf="data" class="mr-gallery mr-wp-content">
    <div class="mr-gallery__wrapper wp-block-gallery has-zoom {{ grid ? 'columns-' + grid : '' }}">
        <ul class="mr-gallery__items blocks-gallery-grid">
            <li *ngFor="let item of data.items" class="mr-gallery__item blocks-gallery-item">
                <figure>
                    <a (click)="onClick(item.payload)" class="mr-gallery__link">
                        <img [src]="item.thumbSrc" [alt]="item.title" class="mr-gallery__image">
                    </a>
                </figure>
            </li>
        </ul>
    </div>
    <div *ngIf="data.selected" class="mr-modal mr-gallery-modal" (click)="onClose()">
        <div class="mr-modal__overlay">
            <div class="mr-modal__window mr-gallery-modal__window">
                <div class="mr-modal__header mr-gallery-modal__header">
                    <div class="mr-modal__close">
                        <a class="mr-modal__close-link" (click)="onClose()"><span class="n7-icon-close"></span></a>
                    </div>
                </div>
                <div class="mr-modal__content mr-gallery-modal__content">
                    <div class="mr-gallery__zoom-image-wrapper">
                        <img [src]="data.selected.fullSrc" [alt]="data.selected.title" class="mr-gallery__zoom-image">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
