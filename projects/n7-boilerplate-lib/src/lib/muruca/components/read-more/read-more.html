<div class="mr-read-more {{this.state}}"
     *ngIf="data"
     #root>
     <!-- Child component -->
     <ng-content class="content"></ng-content>
     <div [hidden]="!collapsed.value"
          (click)="handleToggle()"
          class="mr-read-more__btn">
          <span class="n7-icon-plus"></span>
          {{ data.label }}
     </div>
</div>
