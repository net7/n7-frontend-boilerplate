<div #root *ngIf="data" class="mr-read-more"
    [ngClass]="{
        'is-collapsed': !!(hasReadmore && collapsed),
        'is-expanded': !!(hasReadmore && !collapsed)
    }">
        <div class="mr-read-more__content"
        [ngStyle]="{
            height: hasReadmore ? wrapperHeight + 'px' : false
        }">
            <!-- Child component -->
            <ng-content class="content"></ng-content>
        </div>
        <div *ngIf="hasReadmore" class="mr-read-more__btn" (click)="handleToggle()">
            <span class="n7-icon-{{ collapsed ? 'plus' : 'minus' }}"></span>
            <span class="mr-read-more__btn-text">{{ collapsed ? data.labels.more : data.labels.less }}</span>
        </div>
</div>
