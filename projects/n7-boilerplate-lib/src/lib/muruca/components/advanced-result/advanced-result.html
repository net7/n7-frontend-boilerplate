<div *ngIf="data"
     class="mr-result">
    <n7-item-preview [data]="data"></n7-item-preview>
    <div class="mr-result-highlight__metadata"
         *ngFor="let highlightGroup of data.highlights">
        <div class="mr-result-highlight__metadata-group">
            <!-- METADATA GROUP TITLE -->
            <h3 class="mr-result-highlight__metadata-group-title"
                *ngIf="highlightGroup.title"
                [innerHTML]="highlightGroup.title">
            </h3>
            <!-- METADATA ITEM -->
            <div class="mr-result-highlight__metadata-item {{ item.classes || '' }}"
                 *ngFor="let item of highlightGroup.items">
                <!-- ICON -->
                <span class="mr-result-highlight__metadata-item-icon {{item.icon}}"
                      *ngIf="item.icon">
                </span>
                <!-- LABEL -->
                <span class="mr-result-highlight__metadata-item-label"
                      *ngIf="item.label"
                      [innerHTML]="item.label">
                </span>
                <!-- VALUE W/ HREF -->
                <a *ngIf="item.href"
                   [href]="item.href">
                    <span class="mr-result-highlight__metadata-item-value"
                          *ngIf="item.value"
                          [innerHTML]="item.value">
                    </span>
                </a>
                <!-- VALUE W/OUT HREF -->
                <span class="mr-result-highlight__metadata-item-value"
                      *ngIf="item.value && !item.href"
                      [innerHTML]="item.value">
                </span>
            </div>
        </div>
    </div>
</div>
