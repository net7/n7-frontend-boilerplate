<div *ngIf="data" class="dv-card {{ data.classes || '' }}">
    <div class="dv-card__top">
        <div *ngIf="data.title as title" class="dv-card__title {{ title.classes || '' }}">{{ title.text }}</div>
        <div *ngIf="data.actions" class="dv-card__actions">#TODO: actions</div>
    </div>
    <div class="dv-card__content">
        <section *ngFor="let section of data.sections" class="dv-card__section {{ section.classes || '' }}">
            <ng-container *ngTemplateOutlet="blocks; context: { $implicit: section.items }"></ng-container>
        </section>
    </div>
</div>

<ng-template #blocks let-items>
    <ng-container *ngFor="let item of items">
        <div class="{{ 'dv-card__item dv-card__' + item.type }}">
            <ng-container [ngSwitch]="item.type">
    
                <!-- TEXT -->
                <ng-container *ngSwitchCase="'text'">
                    <div [innerHTML]="data.widgets[item.id].ds.out$ | async"></div> 
                </ng-container> 

                <!-- DATA WIDGET -->
                <ng-container *ngSwitchCase="'data-widget'">
                    <n7-data-widget 
                    [data]="data.widgets[item.id].ds.out$ | async"
                    [emit]="data.widgets[item.id].emit"></n7-data-widget> 
                </ng-container> 

            </ng-container>
        </div>
    </ng-container>
</ng-template>
