<div *ngIf="data" class="dv-card {{ data.classes || '' }}">
    <div *ngIf="data.title || data.actions" class="dv-card__header">
        <div *ngIf="data.title as title" class="dv-card__title-wrapper {{ title.classes || '' }}">
            <h1 class="dv-card__title">{{ title.text }}</h1>
        </div>
        <div *ngIf="data.actions as actions" class="dv-card__actions-wrapper">
            <dv-card-action *ngFor="let actionData of actions" 
                [data]="actionData" 
                [emit]="data.cardCustomEmit"></dv-card-action>
        </div>
    </div>
    <div class="dv-card__content">
        <section *ngFor="let section of data.sections" class="dv-card__section {{ section.classes || '' }}">
            <ng-container *ngTemplateOutlet="blocks; context: { $implicit: section.items }"></ng-container>
        </section>
    </div>
</div>

<ng-template #blocks let-items>
    <ng-container *ngFor="let item of items">
        <div class="{{ 'dv-card__item dv-card__' + item.type }}">
            <!-- TEXT -->
            <ng-container *ngIf="item.type === 'text'">
                <div [innerHTML]="data.widgets[item.id].ds.out$ | async"></div> 
            </ng-container> 

            <!-- DATA WIDGET -->
            <ng-container *ngIf="item.type === 'data-widget'">
                <n7-data-widget 
                [data]="data.widgets[item.id].ds.out$ | async"
                [emit]="data.widgets[item.id].emit"></n7-data-widget> 
            </ng-container> 

            <!-- TABLE -->
            <ng-container *ngIf="item.type === 'table'">
                <n7-table 
                [data]="data.widgets[item.id].ds.out$ | async"
                [emit]="data.widgets[item.id].emit"></n7-table> 
            </ng-container> 

            <!-- APEX CHARTS -->
            <ng-container *ngIf="item.type.includes('apex')">
                <n7-chart [data]="data.widgets[item.id].ds.out$ | async"></n7-chart> 
            </ng-container> 
        </div>
    </ng-container>
</ng-template>
