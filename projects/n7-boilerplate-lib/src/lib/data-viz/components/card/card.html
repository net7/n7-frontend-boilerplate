<div *ngIf="data" class="dv-card {{ data.classes || '' }}">
    <ng-container *ngFor="let area of ['header', 'content', 'footer']">
        <div *ngIf="data[area]" class="dv-card__{{ area }}">
            <section *ngFor="let section of data[area].sections" class="dv-card__section {{ section.classes || '' }}">
                <ng-container *ngTemplateOutlet="blocks; context: { $implicit: section.items }"></ng-container>
            </section>
        </div>
    </ng-container>
</div>

<ng-template #blocks let-items>
    <ng-container *ngFor="let item of items">
        <div class="{{ 'dv-card__item dv-card__' + item.type }}">
            <!-- TEXT -->
            <ng-container *ngIf="item.type === 'text'">
                <dv-card-text-item 
                [data]="data.widgets[item.id].ds.out$ | async"
                [emit]="data.widgets[item.id].emit"></dv-card-text-item> 
            </ng-container> 

            <!-- DATA WIDGET -->
            <ng-container *ngIf="item.type === 'data-widget'">
                <n7-data-widget 
                [data]="data.widgets[item.id].ds.out$ | async"
                [emit]="data.widgets[item.id].emit"></n7-data-widget> 
            </ng-container> 

            <!-- TABLE -->
            <ng-container *ngIf="item.type === 'table'">
                <n7-table 
                [data]="data.widgets[item.id].ds.out$ | async"
                [emit]="data.widgets[item.id].emit"></n7-table> 
            </ng-container> 

            <!-- INNER TITLE -->
            <ng-container *ngIf="item.type === 'inner-title'">
                <n7-inner-title 
                [data]="data.widgets[item.id].ds.out$ | async"
                [emit]="data.widgets[item.id].emit"></n7-inner-title> 
            </ng-container> 

            <!-- SELECT -->
            <ng-container *ngIf="item.type === 'select'">
                <n7-input-select 
                [data]="data.widgets[item.id].ds.out$ | async"
                [emit]="data.widgets[item.id].emit"></n7-input-select> 
            </ng-container> 

            <!-- APEX CHARTS -->
            <ng-container *ngIf="item.type.includes('apex')">
                <n7-chart [data]="data.widgets[item.id].ds.out$ | async"></n7-chart> 
            </ng-container> 

            <!-- MAP -->
            <ng-container *ngIf="item.type === 'map'">
                <n7-map [data]="data.widgets[item.id].ds.out$ | async"></n7-map> 
            </ng-container> 
        </div>
    </ng-container>
</ng-template>
