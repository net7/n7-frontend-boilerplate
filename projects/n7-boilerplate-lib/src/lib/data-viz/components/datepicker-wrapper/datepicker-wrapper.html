<div *ngIf="data" class="dv-datepicker-wrapper {{ data.select.classes || '' }}">
    <div class="dv-datepicker-wrapper__label" (click)="toggleDropDown(data.payload)">
        <input type="text" [value]="data.select.label" [readOnly]="true"/>
        <span class="{{data.select.icon}}"></span>
    </div>
    <div class="dv-datepicker-wrapper__dropdown" [hidden]="data.select.hidden">
        <ul class="dv-datepicker-wrapper__dropdown-list">
            <li class="dv-datepicker-wrapper__dropdown-list-option {{ opt.classes || '' }}" *ngFor="let opt of data.select.items" (click)="onClick(opt.payload)">{{opt.text}}</li>
        </ul>
    </div>
    <n7-datepicker
        [hidden]="data.datepicker.hidden"
        [data]="data.datepicker.data"
        [emit]="emit">
    </n7-datepicker>
</div>
