<div class="n7b-page-wrapper" id="main-layout">
    <div class="n7b-page-content">
        <n7-header 
        [emit]="lb.widgets['header'].emit"
        [data]="lb.widgets['header'].ds.out$ | async"></n7-header>

        <n7-nav 
        *ngIf="!lb.dataSource.options.sidebar"
        [emit]="lb.widgets['subnav'].emit"
        [data]="lb.widgets['subnav'].ds.out$ | async">
        </n7-nav>

        <main class="n7b-content">
            <div class="n7b-top-page-bar">
                <div class="n7b-top-page-bar__main">
                    <h1 class="n7b-top-page-bar__title">#PAGE TITLE</h1>
                    <!-- <n7-breadcrumbs *ngIf="lb.widgets['breadcrumbs'].ds.isVisible()" 
                    [emit]="lb.widgets['breadcrumbs'].emit"
                    [data]="lb.widgets['breadcrumbs'].ds.out$ | async"></n7-breadcrumbs>--> 
                </div>
                <!--<div *ngIf="lb.dataSource.pageTools" class="n7b-top-page-bar__tools">
                    <a *ngFor="let tool of lb.dataSource.pageTools" 
                    (click)="lb.eventHandler.emitInner('tools-click', tool.payload)" 
                    class="n7-btn {{ tool.classes || '' }}">
                        {{ tool.label | translate }}
                    </a>
                </div>-->
            </div>
            
            <div class="n7b-alert-bar">
                <!--<n7-alert
                [attr.id]="'main-layout-alert'"
                [data]="lb.dataSource.alertData$ | async"
                [emit]="lb.dataSource.closeAlert.bind(lb.dataSource)"></n7-alert>-->
            </div>
            <ng-content></ng-content>
        </main>
    </div>

    <div class="n7b-footer-wrapper"></div>
</div>
