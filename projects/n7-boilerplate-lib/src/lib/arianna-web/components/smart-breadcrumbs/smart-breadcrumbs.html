<div *ngIf="data" class="n7-breadcrumbs {{ data.classes || '' }}" #bcdiv>
    <nav class="n7-breadcrumbs__nav">
        <ol class="n7-breadcrumbs__list" #bcol>
            <li *ngFor="let item of data.items" class="n7-breadcrumbs__item {{ item.classes || '' }}">
                <span class="ellipsis-target">
                    <n7-anchor-wrapper [classes]="item.classes"
                        [data]="item.anchor"
                        (clicked)="onClick($event)">
                        {{ item.label }}
                    </n7-anchor-wrapper>
                </span>
            </li>
        </ol>
    </nav>
</div>
