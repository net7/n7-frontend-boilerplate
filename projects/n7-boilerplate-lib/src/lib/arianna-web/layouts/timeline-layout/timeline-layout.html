<div class="aw-map" id="map-layout" *ngIf="lb.dataSource">
    <n7-inner-title [data]="{
               title: {
                    main: {
                         text: 'Gli eventi dell\'archivio'
                    }
               }
          }">
    </n7-inner-title>
    <n7-timeline [data]="lb.widgets['aw-timeline'].ds.out$ | async"></n7-timeline>
    <!-- RESULTS -->
    <div class="map-layout-results">
        <ng-container *ngIf="(lb.dataSource.state$ | async) === 'LOADING'">
            <n7-loader></n7-loader>
        </ng-container>

        <ng-container *ngIf="(lb.dataSource.state$ | async) === 'EMPTY'">
            <p>Clicca su un evento della timeline per vedere tutti gli oggetti culturali collegati.</p>
        </ng-container>

        <ng-container *ngIf="(lb.dataSource.state$ | async) === 'SUCCESS'">
            <n7-inner-title [data]="lb.widgets['aw-scheda-inner-title'].ds.out$ | async">
            </n7-inner-title>
            <div *ngFor="let preview of (lb.widgets['aw-linked-objects'].ds.out$ | async)?.previews">
                <n7-smart-breadcrumbs [data]="preview.breadcrumbs">
                </n7-smart-breadcrumbs>
                <n7-item-preview [data]="preview" [emit]="lb.widgets['aw-linked-objects'].emit">
                </n7-item-preview>
            </div>
            <n7-smart-pagination *ngIf="lb.dataSource.total > 0"
                [data]="lb.widgets['n7-smart-pagination'].ds.out$ | async"
                [emit]="lb.widgets['n7-smart-pagination'].emit">
            </n7-smart-pagination>
        </ng-container>
    </div>
</div>
