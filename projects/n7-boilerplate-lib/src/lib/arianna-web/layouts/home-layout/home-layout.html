<div class="aw-home" *ngIf="lb.dataSource">
    <!-- Hero section at the top of the page -->
    <div class="aw-home__top-hero">
        <n7-hero [data]="lb.widgets['aw-hero'].ds.out$ | async" [emit]="lb.widgets['aw-hero'].emit">
        </n7-hero>
    </div>

    <!-- Bubble chart -->
    <div class="aw-home__bubble-wrapper n7-side-auto-padding"
        [ngClass]="{ 'has-results' : lb.dataSource.selectedBubbles.length > 0 }" *ngIf="lb.dataSource.bubblesEnabled">
        <div class="aw-home__facets-wrapper-loading" *ngIf="!(lb.widgets['aw-home-facets-wrapper'].ds.out$ | async)">
            <n7-content-placeholder *ngFor="let i of [0,1,2,3]" [data]="{
                blocks: [{
                    classes: 'facet-placeholder-header'
                }, {
                    classes: 'facet-placeholder-input'
                }] 
            }"></n7-content-placeholder>
        </div>
        <div class="aw-home__facets-wrapper" *ngIf="!!(lb.widgets['aw-home-facets-wrapper'].ds.out$ | async)">
            <span class="aw-home__facet"
                *ngFor="let widgetData of lb.widgets['aw-home-facets-wrapper'].ds.out$ | async;">
                <n7-facet-header [data]="widgetData.header" [emit]="lb.widgets['aw-home-facets-wrapper'].emit">
                </n7-facet-header>
                <n7-facet [data]="widgetData.input" [emit]="lb.widgets['aw-home-facets-wrapper'].emit">
                </n7-facet>
            </span>
        </div>

        <div class="aw-home__bubble-chart-wrapper-loading" *ngIf="!(lb.widgets['aw-bubble-chart'].ds.out$ | async)">
            <n7-content-placeholder [data]="{
                blocks: [
                    {
                        classes: 'facet-placeholder-item-1'
                    }
                ]
            }"></n7-content-placeholder>
        </div>
        <div class="aw-home__bubble-chart-wrapper" *ngIf="!!(lb.widgets['aw-bubble-chart'].ds.out$ | async)"
            [style.overflow]="lb.dataSource.loadingBubbles ? 'visible' : 'hidden'">
            <aw-bubble-chart-wrapper>
                <aw-chart-tippy 
                    [data]="lb.widgets['aw-chart-tippy'].ds.out$ | async"
                    [emit]="lb.widgets['aw-chart-tippy'].emit">
                </aw-chart-tippy>
                <n7-bubble-chart [data]="lb.widgets['aw-bubble-chart'].ds.out$ | async"
                    [emit]="lb.widgets['aw-bubble-chart'].emit">
                </n7-bubble-chart>
            </aw-bubble-chart-wrapper>
        </div>

        <!-- Linked objects -->
        <ng-container *ngIf="(lb.widgets['aw-bubble-chart'].ds.out$ | async)?.selected.length > 0;">
            <div class="aw-home__bubble-results" id="home-bubble-results">
                <div *ngIf="lb.dataSource.numOfItemsStr" class="aw-home__bubble-results-title-wrapper">
                    <h1 class="aw-home__bubble-results-title"><strong class="aw-home__bubble-results-title-counter">
                            {{ lb.dataSource.numOfItemsStr }}</strong> <span> Oggetti culturali</span>
                    </h1>
                </div>
                <div class="aw-home__bubble-tags-wrapper">
                    <h3 class="aw-home__bubble-tags-title">Collegati a </h3>
                    <ng-container *ngFor="let widgetData of lb.widgets['aw-home-item-tags-wrapper'].ds.out$ | async;">
                        <n7-tag [data]="widgetData" [emit]="lb.widgets['aw-home-item-tags-wrapper'].emit">
                        </n7-tag>
                        <br>
                    </ng-container>
                </div>

                <div class="aw-home__bubble-results-list-wrapper">
                    <div class="aw-home__bubble-results-list-loading" *ngIf="lb.dataSource.resultsListIsLoading">
                        <n7-content-placeholder [data]="{
                            blocks: [{
                                classes: 'search-result-placeholder-title'
                            }, {
                                classes: 'search-result-placeholder-metadata'
                            }]
                        }"></n7-content-placeholder>
                        <n7-content-placeholder [data]="{
                            blocks: [{
                                classes: 'search-result-placeholder-title'
                            }, {
                                classes: 'search-result-placeholder-metadata'
                            }]
                        }"></n7-content-placeholder>
                        <n7-content-placeholder [data]="{
                            blocks: [{
                                classes: 'search-result-placeholder-title'
                            }, {
                                classes: 'search-result-placeholder-metadata'
                            }]
                        }"></n7-content-placeholder>
                        <n7-content-placeholder [data]="{
                            blocks: [{
                                classes: 'search-result-placeholder-title'
                            }, {
                                classes: 'search-result-placeholder-metadata'
                            }]
                        }"></n7-content-placeholder>
                        <n7-content-placeholder [data]="{
                            blocks: [{
                                classes: 'search-result-placeholder-title'
                            }, {
                                classes: 'search-result-placeholder-metadata'
                            }]
                        }"></n7-content-placeholder>
                    </div>
                    <div *ngIf="!lb.dataSource.resultsListIsLoading" class="aw-home__bubble-results-list"
                        [attr.id]="'bubble-results-list'" (scroll)="lb.eventHandler.emitOuter('scroll', $event.target)">

                        <div class="aw-home__bubble-results-fallback"
                            *ngIf="(lb.widgets['aw-linked-objects'].ds.out$ | async)?.result.length < 1;">
                            <p class="aw-home__bubble-results-fallback-text">
                                {{ (lb.widgets['aw-linked-objects'].ds.out$ | async)?.fallback }}
                            </p>
                            <button class="n7-btn aw-home__bubble-results-reset"
                                (click)="lb.eventHandler.emitInner('clearselection')">
                                Resetta la ricerca
                            </button>
                        </div>

                        <ng-container
                            *ngFor="let widgetData of (lb.widgets['aw-linked-objects'].ds.out$ | async)?.result;">
                            <n7-item-preview [data]="widgetData" [emit]="lb.widgets['aw-linked-objects'].emit">
                            </n7-item-preview>
                        </ng-container>

                        <ng-container *ngIf="(lb.widgets['aw-linked-objects'].ds.out$ | async)?.isLoading">
                            <div class="aw-home__bubble-results-list-loader">
                                <n7-loader [data]="(lb.widgets['aw-linked-objects'].ds.out$ | async)?.loaderData">
                                </n7-loader>
                            </div>
                        </ng-container>
                    </div>
                    <div [ngClass]="{ 'is-visible' : lb.dataSource.hasScrollBackground }"
                        class="aw-home__bubble-results-list-wrapper-with-scroll"></div>
                </div>
                <!-- aw-linked-objects__actions -->
                <ng-container
                    *ngIf="(lb.widgets['aw-linked-objects'].ds.out$ | async)?.result.length > 0 && !lb.dataSource.resultsListIsLoading">
                    <div *ngIf="(lb.widgets['aw-linked-objects'].ds.out$ | async)?.actions as action"
                        class="aw-home__bubble-results-list-actions">
                        <button (click)="lb.eventHandler.emitInner('bubbleresultsviewallclick')"
                            class="n7-btn n7-btn-light n7-btn-l aw-home__bubble-results-list-view-all">
                            {{action[0].label}}
                        </button>
                    </div>
                </ng-container>

            </div>
        </ng-container>
    </div>

    <!-- Outer links -->
    <div *ngIf="lb.dataSource.outerLinks && lb.dataSource.outerLinks.length > 0" class="aw-home__outer-links">
        <section class="aw-home__outer-links-wrapper n7-side-auto-padding">
            <h2 class="aw-home__outer-links-title" *ngIf="lb.dataSource.outerLinksTitle">
                {{ lb.dataSource.outerLinksTitle }}
            </h2>
            <div class="aw-home__outer-links-items">
                <!-- Item preview -->
                <n7-item-preview *ngFor="let outerLink of lb.dataSource.outerLinks" [data]="outerLink"
                    [emit]="lb.eventHandler.outerLinkClick.bind(lb.eventHandler)">
                </n7-item-preview>
                <!-- END // Item preview -->
            </div>
        </section>
    </div>
    <!-- END // Outer links -->

    <!-- Hero section at the bottom of the page -->
    <div class="aw-home__bottom-hero">
        <n7-hero [data]="lb.widgets['aw-home-hero-patrimonio'].ds.out$ | async"
            [emit]="lb.widgets['aw-home-hero-patrimonio'].emit">
        </n7-hero>
    </div>

    <!-- Adavanced autocomplete popover  -->
    <div class="aw-home__advanced-autocomplete" id="aw-home-advanced-autocomplete-popover" style="display: none;">
        <div class="aw-home__advanced-autocomplete-loader" *ngIf="lb.dataSource.homeAutocompleteIsLoading">
            <n7-loader [data]="{}"></n7-loader>
        </div>
        <n7-advanced-autocomplete *ngIf="!lb.dataSource.homeAutocompleteIsLoading"
            [data]="lb.widgets['aw-home-autocomplete'].ds.out$ | async"
            [emit]="lb.widgets['aw-home-autocomplete'].emit">
        </n7-advanced-autocomplete>
        <button *ngIf="(lb.widgets['aw-home-autocomplete'].ds.out$ | async)?.results.length == 0"
                class="n7-btn"
                (click)="lb.eventHandler.emitInner('extendsearch', $event.target)">
            Cerca in tutti i campi
        </button>
    </div>

    <!-- Simple autocomplete popover. DO NOT CHANGE parent div class! -->
    <!-- Creating one template for each facet -->
    <div *ngFor="let widgetData of lb.widgets['aw-home-facets-wrapper'].ds.out$ | async;"
        class="aw-home__simple-autocomplete aw-simple-autocomplete__template" style="display: none;">
        <div class="aw-home__simple-autocomplete-content aw-simple-autocomplete__tippy-wrapper">
            <div class="aw-home__simple-autocomplete-loader aw-simple-autocomplete__tippy-wrapper-loader"
                *ngIf="(lb.widgets['aw-autocomplete-wrapper'].ds.out$ | async)?.loading">
                <n7-loader [data]="{}"></n7-loader>
            </div>
            <n7-simple-autocomplete *ngIf="!(lb.widgets['aw-autocomplete-wrapper'].ds.out$ | async)?.loading"
                [data]="lb.widgets['aw-autocomplete-wrapper'].ds.out$ | async"
                [emit]="lb.widgets['aw-autocomplete-wrapper'].emit">
            </n7-simple-autocomplete>
        </div>
    </div>
</div>
