<div class="aw-map" id="map-layout" *ngIf="lb.dataSource">
    <n7-inner-title [data]="{
        title: {
            main: {
                    text: 'I luoghi dell\'archivio'
            }
        }
    }">
    </n7-inner-title>
    <n7-map [data]="lb.widgets['aw-map'].ds.out$ | async">
    </n7-map>

    <!-- RESULT LIST -->
    <div class="map-layout-results">
        <ng-container *ngIf="lb.dataSource.loading$ | async">
            <n7-loader></n7-loader>
        </ng-container>

        <ng-container *ngIf="!(lb.dataSource.loading$ | async)">
            <n7-inner-title 
                [data]="lb.widgets['aw-scheda-inner-title'].ds.out$ | async">
            </n7-inner-title>
            <div *ngFor="let preview of (lb.widgets['aw-linked-objects'].ds.out$ | async)?.previews">
                <n7-smart-breadcrumbs 
                    [data]="preview.breadcrumbs">
                </n7-smart-breadcrumbs>
                <n7-item-preview 
                    [data]="preview" 
                    [emit]="lb.widgets['aw-linked-objects'].emit">
                </n7-item-preview>
            </div>
            <n7-smart-pagination *ngIf="lb.dataSource.total > 0"
                [data]="lb.widgets['n7-smart-pagination'].ds.out$ | async"
                [emit]="lb.widgets['n7-smart-pagination'].emit">
            </n7-smart-pagination>
        </ng-container>
    </div>
</div>
