<div class="aw-entity n7-side-auto-padding" *ngIf="lb.dataSource">
    <div class="aw-entity__sidebar">
        <!-- Custom header -->
        <div class="aw-entity__sidebar-title-wrapper color-{{lb.dataSource.navHeader.color}}">
            <h1 class="aw-entity__sidebar-title">
                <span class="aw-entity__sidebar-title-icon {{lb.dataSource.navHeader.icon}}"></span>
                <span class="aw-entity__sidebar-title-text">{{lb.dataSource.navHeader.text}}</span>
            </h1>
        </div>
        <!-- Navigation -->
        <n7-nav [data]="lb.widgets['aw-entita-nav'].ds.out$ | async" [emit]="lb.widgets['aw-entita-nav'].emit">
        </n7-nav>
    </div>
    <!-- lb.dataSource.selectedTab -->
    <div class="aw-entity__content">
        <section>
            <div *ngIf="lb.dataSource.myResponse.wikiTab || lb.dataSource.myResponse.extraTab"
                class="aw-entity__content-section" [hidden]="lb.dataSource.selectedTab != 'overview'">
                <div class="aw-entity__overview-description">
                    {{lb.dataSource.myResponse.extraTab}}
                </div>
                <div class="aw-entity-layout__button-wrapper">
                    <button *ngIf="lb.dataSource.myResponse.wikiTab" class="n7-btn n7-btn-light"
                        (click)="lb.eventHandler.emitInner('showmore', 'wiki')">
                        DESCRIZIONE WIKIPEDIA <i class="n7-icon-angle-right"></i>
                    </button>
                    <button *ngIf="lb.dataSource.myResponse.extraTab" class="n7-btn n7-btn-light"
                        (click)="lb.eventHandler.emitInner('showmore', 'maxxi')">
                        DESCRIZIONE MAXXI <i class="n7-icon-angle-right"></i>
                    </button>
                </div>
            </div>

            <ng-container *ngIf="lb.dataSource.myResponse.fields && lb.dataSource.myResponse.fields.length > 0">
                <div class="aw-entity__content-section aw-entity__content-section-overview"
                    [hidden]="lb.dataSource.selectedTab != 'overview' && lb.dataSource.selectedTab != 'campi'">
                    <div class="aw-entity__content-section-header">
                        <h2 class="aw-entity__content-section-title">Campi</h2>
                        <button class="n7-btn n7-btn-light" (click)="lb.eventHandler.emitInner('showmore', 'campi')">
                            TUTTI I CAMPI <i class="n7-icon-angle-right"></i>
                        </button>
                    </div>
                    <n7-metadata-viewer class="aw-entity-layout__metadata-viewer"
                        [data]="lb.widgets['aw-entita-metadata-viewer'].ds.out$ | async ">
                    </n7-metadata-viewer>
                </div>
            </ng-container>

            <div class="aw-entity__content-section aw-entity__content-section-overview"
                *ngIf="(lb.widgets['aw-linked-objects'].ds.out$ | async)?.previews"
                [hidden]="lb.dataSource.selectedTab != 'overview' && lb.dataSource.selectedTab != 'oggetti-collegati'">
                <div class="aw-entity__content-section-header">
                    <h2 class="aw-entity__content-section-title">Oggetti collegati</h2>

                    <button class="n7-btn n7-btn-light" *ngIf="lb.dataSource.selectedTab == 'overview'"
                        (click)="lb.eventHandler.emitInner('showmore', 'oggetti-collegati')">
                        TUTTI GLI OGGETTI COLLEGATI <i class="n7-icon-angle-right"></i>
                    </button>
                </div>
                <div class="aw-entity__content-item-previews">
                    <ng-container *ngFor="let preview of (lb.widgets['aw-linked-objects'].ds.out$ | async)?.previews">
                        <n7-smart-breadcrumbs [data]="preview.breadcrumbs">
                        </n7-smart-breadcrumbs>
                        <n7-item-preview [data]="preview" [emit]="lb.widgets['aw-linked-objects'].emit">
                        </n7-item-preview>
                    </ng-container>
                </div>
                <n7-pagination [data]="(lb.widgets['aw-linked-objects'].ds.out$ | async)?.pagination"
                    [emit]="lb.widgets['aw-linked-objects'].emit">
                </n7-pagination>
            </div>

            <div class="aw-entity__content-section aw-entity__content-section-overview"
                *ngIf="lb.dataSource.bubblesEnabled"
                [hidden]="lb.dataSource.selectedTab != 'overview' && lb.dataSource.selectedTab != 'entita-collegate'">
                <div class="aw-entity__content-section-header">
                    <h2 class="aw-entity__content-section-title">Entità collegate</h2>
                    <button class="n7-btn n7-btn-light"
                        (click)="lb.eventHandler.emitInner('showmore', 'entita-collegate')"
                        *ngIf="lb.dataSource.selectedTab == 'overview'">
                        TUTTE LE ENTITÀ COLLEGATE <i class="n7-icon-angle-right"></i>
                    </button>
                </div>
                <div [style.overflow]="'hidden'">
                    <aw-bubble-chart-wrapper [hover]="lb.widgets['aw-bubble-chart'].ds.currentHoverEntity"
                        [emit]="lb.widgets['aw-bubble-chart'].emit" [container]="'bubble-chart-container-overview'"
                        [buttons]="['goto']">
                        <n7-bubble-chart [data]="lb.widgets['aw-bubble-chart'].ds.out$ | async"
                            [emit]="lb.widgets['aw-bubble-chart'].emit">
                        </n7-bubble-chart>
                    </aw-bubble-chart-wrapper>
                </div>
            </div>
            <div class="aw-entity__content-section aw-entity__content-section-maxxi"
                *ngIf="lb.dataSource.myResponse.extraTab" [hidden]="lb.dataSource.selectedTab != 'maxxi'">
                <div class="aw-entity__content-section-header aw-entity__content-section-header-decorated">
                    <h2 class="aw-entity__content-section-title">Descrizione Maxxi</h2>
                </div>
                <div>
                    {{lb.dataSource.myResponse.extraTab}}
                </div>
            </div>
            <div class="aw-entity__content-section aw-entity__content-section-wiki"
                *ngIf="lb.dataSource.myResponse.wikiTab" [hidden]="lb.dataSource.selectedTab != 'wiki'">
                <div class="aw-entity__content-section-header aw-entity__content-section-header-decorated">
                    <h2 class="aw-entity__content-section-title">Descrizione Wikipedia</h2>
                </div>
                <div>
                    {{lb.dataSource.myResponse.wikiTab.text}}
                </div>
                <a href="{{lb.dataSource.myResponse.wikiTabUrl}}">
                    {{lb.dataSource.myResponse.wikiTab.url}}
                </a>
            </div>
        </section>
    </div>
</div>
