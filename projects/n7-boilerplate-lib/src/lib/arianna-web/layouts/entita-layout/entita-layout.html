<div class="aw-entita-layout" *ngIf="lb.dataSource">

    <!-- custom header -->
    <div class="n7-nav-header">
        <h1>
            <span class="{{lb.dataSource.navHeader.icon}}"></span>
            {{lb.dataSource.navHeader.text}}
        </h1>
    </div>
    <!-- navigation -->
    <n7-nav 
        [data]="lb.widgets['aw-entita-nav'].ds.out$ | async" 
        [emit]="lb.widgets['aw-entita-nav'].emit">
    </n7-nav>
    <div class="aw-entita-layout__content-wrapper" 
         [ngSwitch]="lb.dataSource.selectedTab">
        <ng-container *ngSwitchCase="'overview'">
            <ng-container *ngTemplateOutlet="overview"></ng-container>
        </ng-container>
        <ng-container *ngSwitchCase="'campi'">
            <ng-container *ngTemplateOutlet="campi"></ng-container>
        </ng-container>
        <ng-container *ngSwitchCase="'oggetti-collegati'">
            <ng-container *ngTemplateOutlet="oggetti"></ng-container>
        </ng-container>
        <ng-container *ngSwitchCase="'entita-collegate'">
            <ng-container *ngTemplateOutlet="entita"></ng-container>
        </ng-container>
        <ng-container *ngSwitchCase="'maxxi'">
            <ng-container *ngTemplateOutlet="maxxi"></ng-container>
        </ng-container>
        <ng-container *ngSwitchCase="'wiki'">
            <ng-container *ngTemplateOutlet="wiki"></ng-container>
        </ng-container>
    </div>
</div>

<!-- navigation page content templates -->
<ng-template #overview>
    <div>
        {{lb.dataSource.myResponse.overviewTab}}
        <div class="aw-entita-layout__button-wrapper">
            <button class="n7-btn n7-btn-light">DESCRIZIONE WIKIPEDIA</button>
            <button class="n7-btn n7-btn-light">DESCRIZIONE MAXXI</button>
        </div>
        
        <ng-container *ngIf="lb.widgets['aw-entita-metadata-viewer'].ds.out$ | async as data">
            <h1>Campi</h1>
            <button class="n7-btn n7-btn-light">TUTTI I CAMPI</button>
            <n7-metadata-viewer 
                class="aw-entita-layout__metadata-viewer"
                [data]="data">
            </n7-metadata-viewer>
        </ng-container>
        
        <h1>Oggetti collegati</h1><button class="n7-btn n7-btn-light">TUTTI GLI OGGETTI COLLEGATI</button>
        <ng-container *ngFor="let preview of lb.widgets['aw-linked-objects'].ds.out$ | async">
            <n7-breadcrumbs
                [data]="preview.breadcrumbs">
            </n7-breadcrumbs>
            <n7-item-preview
                [data]="preview"
                [emit]="lb.widgets['aw-linked-objects'].emit">
            </n7-item-preview>
        </ng-container>
    </div>
</ng-template>

<ng-template #campi>
    <div>
        <ng-container *ngIf="lb.widgets['aw-entita-metadata-viewer'].ds.out$ | async as data">
            <h1>Campi</h1>
            <n7-metadata-viewer class="aw-entita-layout__metadata-viewer"
                [data]="data">
            </n7-metadata-viewer>
        </ng-container>
    </div>
</ng-template>

<ng-template #oggetti>
    <div>
        <h1>Oggetti collegati</h1>
        <ng-container 
            *ngFor="let preview of (lb.widgets['aw-linked-objects'].ds.out$ | async)?.previews">
            <n7-breadcrumbs [data]="preview.breadcrumbs">
            </n7-breadcrumbs>
            <n7-item-preview [data]="preview">
            </n7-item-preview>
        </ng-container>
        <n7-pagination 
            [data]="(lb.widgets['aw-linked-objects'].ds.out$ | async)?.pagination"
            [emit]="lb.widgets['aw-linked-objects'].emit">
        </n7-pagination>
    </div>
</ng-template>

<ng-template #entita>
    <div>
        Page entita
    </div>
</ng-template>

<ng-template #maxxi>
    <div>
        Page maxxi
    </div>
</ng-template>

<ng-template #wiki>
    <div>
        Page wiki
    </div>
</ng-template>
