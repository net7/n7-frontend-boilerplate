<div class="collection-layout"
     *ngIf="lb.dataSource as dataSource">
    <n7-inner-title [data]="dataSource.innerTitleData">
    </n7-inner-title>

    <section class="n7-grid-3" *ngIf="dataSource.loadedCollections">
        <ng-container *ngFor="let item of dataSource.loadedCollections.value">
            <n7-item-preview [data]="item">
            </n7-item-preview>
        </ng-container>
    </section>
    
    <section>
        <button class="n7-btn n7-btn-cta n7-btn-xl" (click)="dataSource.loadMore()">
            MOSTRA ALTRI
        </button>
    </section>
</div>
