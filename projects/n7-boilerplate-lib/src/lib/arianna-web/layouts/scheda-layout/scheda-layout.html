<div class="aw-scheda" id="scheda-layout">
    <div class="aw-scheda__content n7-side-auto-padding sticky-parent"
         [ngClass]="{ 'is-collapsed' : lb.dataSource.sidebarCollapsed }">

         <!-- Left sidebar: tree -->
        <div class="aw-scheda__tree sticky-target"
            [ngClass]="{ 'is-sticky': lb.dataSource.sidebarIsSticky }">
            <n7-sidebar-header
                [data]="lb.widgets['aw-sidebar-header'].ds.out$ | async"
                [emit]="lb.widgets['aw-sidebar-header'].emit"
            ></n7-sidebar-header>
            <n7-tree
                [data]="lb.widgets['aw-tree'].ds.out$ | async"
                [emit]="lb.widgets['aw-tree'].emit"
                *ngIf="!lb.dataSource.sidebarCollapsed"
            ></n7-tree>
        </div>

        <!-- Scheda details -->
        <div class="aw-scheda__scheda-wrapper">
            <n7-breadcrumbs
                [data]="lb.widgets['aw-scheda-breadcrumbs'].ds.out$ | async"
                [emit]="lb.widgets['aw-scheda-breadcrumbs'].emit">
            </n7-breadcrumbs>

            <n7-inner-title
                [data]="lb.widgets['aw-scheda-inner-title'].ds.out$ | async">
            </n7-inner-title>

            <n7-image-viewer
                [data]="lb.widgets['aw-scheda-image'].ds.out$ | async">
            </n7-image-viewer>

            <section class="aw-scheda__description" *ngIf="lb.dataSource.contentParts.content">
                <div *ngFor="let part of lb.dataSource.contentParts">
                    <div [innerHTML]="part.content"></div>
                </div>
            </section>

            <section class="aw-scheda__metadata"
                     *ngIf="lb.dataSource.hasMetadata">
                <div class="aw-scheda__inner-title">
                    {{lb.dataSource.metadataSectionTitle}}
                </div>
                <n7-metadata-viewer
                    [data]="lb.widgets['aw-scheda-metadata'].ds.out$ | async">
                </n7-metadata-viewer>
            </section>

            <section
                class="aw-scheda__bubble-chart"
                *ngIf="lb.dataSource.bubblesEnabled">
                <div
                    *ngIf = "lb.dataSource.hasBubbles"
                    class="aw-scheda__inner-title">{{lb.dataSource.bubbleChartSectionTitle}}
                </div>
                <div [style.overflow]="'hidden'">
                    <aw-bubble-chart-wrapper
                        [hover]="lb.widgets['aw-bubble-chart'].ds.currentHoverEntity"
                        [emit]="lb.widgets['aw-bubble-chart'].emit"
                        [container]="'bubble-chart-container'"
                        [buttons]="['goto']">
                        <n7-bubble-chart
                            [data]="lb.widgets['aw-bubble-chart'].ds.out$ | async"
                            [emit]="lb.widgets['aw-bubble-chart'].emit">
                        </n7-bubble-chart>
                    </aw-bubble-chart-wrapper>
                </div>
            </section>

            <section
                *ngIf = "lb.dataSource.hasSimilarItems"
                id="related-item-container" class="aw-scheda__related">
                <div class="aw-scheda__inner-title">{{lb.dataSource.similarItemsSectionTitle}}</div>
                <div class="aw-scheda__related-items">
                    <!--<ng-container *ngFor="let widgetData of lb.widgets['aw-linked-objects'].ds.out$ | async;">-->
                    <ng-container *ngFor="let preview of (lb.widgets['aw-linked-objects'].ds.out$ | async)?.previews">
                        <n7-item-preview
                            [data]="preview"
                            [emit]="lb.widgets['aw-linked-objects'].emit"
                            >
                        </n7-item-preview>
                    </ng-container>
                </div>
             </section>
        </div>
    </div>
</div>
