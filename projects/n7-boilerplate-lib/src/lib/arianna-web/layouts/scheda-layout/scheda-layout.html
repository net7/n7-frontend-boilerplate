<div class="aw-scheda"
     id="scheda-layout">
    <div class="aw-scheda__content n7-side-auto-padding sticky-parent"
         [ngClass]="{ 'is-collapsed' : lb.dataSource.sidebarCollapsed }">
        <!-- Left sidebar: tree -->
        <div class="aw-scheda__tree sticky-target"
             [ngClass]="{ 'is-sticky': lb.dataSource.sidebarIsSticky }">
            <n7-sidebar-header [data]="lb.widgets['aw-sidebar-header'].ds.out$ | async"
                               [emit]="lb.widgets['aw-sidebar-header'].emit"></n7-sidebar-header>
            <div class="aw-scheda__tree-content-loading"
                 *ngIf="!(lb.widgets['aw-tree'].ds.out$ | async)">
                <n7-content-placeholder *ngFor="let n of [0,1,2,3]"
                                        [data]="{
                    blocks: [{
                        classes: 'tree-placeholder-item'
                    }]
                }"></n7-content-placeholder>
            </div>
            <div class="aw-scheda__tree-content"
                 (click)="lb.eventHandler.emitOuter('treeposition', $event)"
                 [ngStyle]="{
                    'max-height': lb.dataSource.treeMaxHeight,
                    'overflow': 'auto'
                }">
                <n7-tree [data]="lb.widgets['aw-tree'].ds.out$ | async"
                         [emit]="lb.widgets['aw-tree'].emit"
                         *ngIf="!lb.dataSource.sidebarCollapsed">
                </n7-tree>
            </div>
        </div>

        <!-- Scheda details -->
        <div class="aw-scheda__scheda-wrapper"
             [hidden]="lb.dataSource.contentIsLoading">
            <n7-smart-breadcrumbs *ngIf="lb.dataSource.hasBreadcrumb"
                                  [data]="lb.widgets['aw-scheda-breadcrumbs'].ds.out$ | async"
                                  [emit]="lb.widgets['aw-scheda-breadcrumbs'].emit">
            </n7-smart-breadcrumbs>

            <div *ngIf="!lb.dataSource.hasBreadcrumb"
                 class="aw-scheda__fake-breadcrumbs">
            </div>

            <div *ngIf="!lb.dataSource.currentId"
                 class="aw-scheda__intro-text"
                 [innerHTML]="lb.dataSource.emptyLabel">
            </div>

            <n7-inner-title [data]="lb.widgets['aw-scheda-inner-title'].ds.out$ | async">
            </n7-inner-title>

            <section class="aw-scheda__section aw-scheda__image-viewer"
                     [hidden]="!lb.dataSource.hasImage">
                <n7-image-viewer [data]="lb.widgets['aw-scheda-image'].ds.out$ | async">
                </n7-image-viewer>
            </section>

            <section class="aw-scheda__section aw-scheda__description"
                     *ngIf="lb.dataSource.contentParts.content">
                <div *ngFor="let part of lb.dataSource.contentParts">
                    <div [innerHTML]="part.content"></div>
                </div>
            </section>

            <section class="aw-scheda__section aw-scheda__metadata"
                     *ngIf="lb.dataSource.hasMetadata">
                <div class="aw-scheda__inner-title"
                     *ngIf="lb.dataSource.metadataSectionTitle">
                    {{lb.dataSource.metadataSectionTitle}}
                </div>
                <n7-metadata-viewer [data]="lb.widgets['aw-scheda-metadata'].ds.out$ | async">
                </n7-metadata-viewer>
            </section>

            <!-- ENTITA COLLEGATE -->
            <section *ngIf="lb.dataSource.hasRelatedEntities"
                     id="related-item-container"
                     class="aw-scheda__section aw-scheda__related">
                <div class="aw-scheda__inner-title">
                    {{lb.dataSource.relatedEntitiesHeader}}
                </div>
                <div class="aw-scheda__related-items n7-grid-2">
                    <ng-container *ngFor="let preview of (lb.widgets['aw-related-entities'].ds.out$ | async)?.previews">
                        <n7-item-preview [data]="preview"
                                         [emit]="lb.widgets['aw-related-entities'].emit">
                        </n7-item-preview>
                    </ng-container>
                </div>
            </section>

            <!-- OGGETTI CULTURALI SIMILI -->
            <section *ngIf="lb.dataSource.hasSimilarItems"
                     id="related-item-container"
                     class="aw-scheda__section aw-scheda__related">
                <div class="aw-scheda__inner-title">
                    {{lb.dataSource.similarItemsSectionTitle}}
                </div>
                <div class="aw-scheda__related-items n7-grid-2">
                    <ng-container *ngFor="let preview of (lb.widgets['aw-linked-objects'].ds.out$ | async)?.previews">
                        <n7-item-preview [data]="preview"
                                         [emit]="lb.widgets['aw-linked-objects'].emit">
                        </n7-item-preview>
                    </ng-container>
                </div>
            </section>
        </div>
    </div>
</div>
