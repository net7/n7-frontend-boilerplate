<div *ngIf="lb.dataSource.facets" class="mr-facets__facets-wrapper {{ lb.dataSource.facets.classes || '' }}">
    <div *ngFor="let section of lb.dataSource.facets.sections" 
    class="mr-facets__single-facet {{ section.classes || '' }}"
    [ngClass]="lb.dataSource.searchService.getState$('section', section.id) | async">
        <n7-facet-header
        *ngIf="section.header"
        [data]="lb.widgets[section.header.id].ds.out$ | async"
        [emit]="lb.widgets[section.header.id].emit"
        ></n7-facet-header>

        <div [hidden]="section.header && !lb.widgets[section.header.id].ds.isOpen()" class="mr-facets__single-facet-content">
            <div *ngFor="let input of section.inputs" 
            [attr.id]="'facet-container-' + input.id"
            class="mr-facets__single-facet-inner-content {{ input.classes || '' }}">
                <ng-container [ngSwitch]="input.type">
    
                    <!-- INPUT TEXT -->
                    <n7-input-text 
                    *ngSwitchCase="'text'"
                    [data]="lb.widgets[input.id].ds.out$ | async"
                    [emit]="lb.widgets[input.id].emit"></n7-input-text>
    
                    <!-- INPUT CHECKBOX -->
                    <n7-input-checkbox 
                    *ngSwitchCase="'checkbox'"
                    [data]="lb.widgets[input.id].ds.out$ | async"
                    [emit]="lb.widgets[input.id].emit"></n7-input-checkbox>
                    
                    <!-- INPUT SELECT -->
                    <n7-input-select 
                    *ngSwitchCase="'select'"
                    [data]="lb.widgets[input.id].ds.out$ | async"
                    [emit]="lb.widgets[input.id].emit"></n7-input-select>
                    
                    <!-- INPUT LINK -->
                    <n7-input-link 
                    *ngSwitchCase="'link'"
                    [data]="lb.widgets[input.id].ds.out$ | async"
                    [emit]="lb.widgets[input.id].emit"></n7-input-link>

                    <!-- INPUT LINKMULTI -->
                    <n7-input-link 
                    *ngSwitchCase="'linkMulti'"
                    [data]="lb.widgets[input.id].ds.out$ | async"
                    [emit]="lb.widgets[input.id].emit"></n7-input-link>
                    
                    <!-- INPUT MAP -->
                    <n7-map 
                    *ngSwitchCase="'map'"
                    [data]="lb.widgets[input.id].ds.out$ | async"
                    [emit]="lb.widgets[input.id].emit"></n7-map>

                    <!-- INPUT HISTOGRAM -->
                    <n7-histogram-range 
                    *ngSwitchCase="'histogram'"
                    [data]="lb.widgets[input.id].ds.out$ | async"
                    [emit]="lb.widgets[input.id].emit"></n7-histogram-range>
                
                </ng-container>
            </div>
        </div>
    </div>
</div>
