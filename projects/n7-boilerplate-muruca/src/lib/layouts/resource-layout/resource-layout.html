<div class="mr-resource mr-layout" 
     *ngIf="lb.dataSource && lb.dataSource.pageConfig"
     [ngClass]="{
        'is-loading': ( layoutState.get$('content') | async ) == 'LOADING',
        'is-error': ( layoutState.get$('content') | async ) == 'ERROR'
      }">
    <!-- RESOURCE LAYOUT CONTENT -->
    <ng-container [ngSwitch]="layoutState.get$('content') | async">
        <!-- loading -->
        <ng-container *ngSwitchCase="'LOADING'">
            <div class="mr-layout__loader">
                <n7-loader></n7-loader>
            </div>
        </ng-container>

        <!-- error -->
        <ng-container *ngSwitchCase="'ERROR'">
            <div class="mr-layout__error">
                <h2>{{ lb.dataSource.errorTitle }}</h2>
                <p>{{ lb.dataSource.errorDescription }}</p>
            </div>
        </ng-container>

        <!-- success -->
        <ng-container *ngSwitchCase="'SUCCESS'">
            <ng-container *ngIf="lb.dataSource.pageConfig.sections as sections">
                <!-- Pass the list of blocks to render to the block template -->
                <div class="mr-resource__top">
                    <ng-container *ngTemplateOutlet="blocks; context: { $implicit: sections.top }"></ng-container>
                </div>
                <div class="mr-resource__content mr-side-margin">
                    <ng-container *ngTemplateOutlet="blocks; context: { $implicit: sections.content }"></ng-container>
                </div>
            </ng-container>
        </ng-container>

    </ng-container>
</div>

<ng-template #blocks let-list>
    <ng-container *ngFor="let section of list">
        <section *ngIf="lb.widgets[section.id].ds.out$ | async"
        class="{{ 'mr-resource__section mr-resource__' + section.type }}">
            <ng-container [ngSwitch]="section.type">
    
                <!-- TABS -->
                <ng-container *ngSwitchCase="'tabs'">
                    <ng-container *ngFor="let tab of lb.widgets[section.id].ds.out$ | async">
                        <n7-anchor-wrapper [data]="tab.anchor" [classes]="tab.classes">
                            <span class="mr-resource__tabs-item">{{ tab.label }}</span>
                        </n7-anchor-wrapper>
                    </ng-container>
                </ng-container>
    
                <!-- INNER TITLE -->
                <ng-container *ngSwitchCase="'title'">
                    <div class="mr-resource__title-content mr-side-margin">
                        <n7-inner-title [data]="lb.widgets[section.id].ds.out$ | async"
                            [emit]="lb.widgets[section.id].emit">
                        </n7-inner-title>
                    </div>
                </ng-container>

                <!-- IMAGE VIEWER IIIF -->
                <ng-container *ngSwitchCase="'viewer-iiif'">
                    <n7-mirador
                        [data]="lb.widgets[section.id].ds.out$ | async">
                    </n7-mirador>
                </ng-container>
    
                <!-- IMAGE VIEWER -->
                <ng-container *ngSwitchCase="'viewer'">

                    <ng-template #imageViewer>
                        <n7-image-viewer 
                            [data]="lb.widgets[section.id].ds.out$ | async" 
                            [emit]="lb.widgets[section.id].emit">
                        </n7-image-viewer>
                        <!-- IMAGE VIEWER TOOLS -->
                        <n7-image-viewer-tools *ngIf="section.tools" 
                            [data]="lb.widgets[section.id + '-tools'].ds.out$ | async" 
                            [emit]="lb.widgets[section.id + '-tools'].emit">
                        </n7-image-viewer-tools>
                        <!-- IMAGE VIEWER OVERLAY DETAILS -->
                        <div *ngIf="lb.widgets[section.id + '-overlay-details'].ds.out$ | async as viewerDetailsData" 
                            class="mr-resource__viewer-overlay-details">
                            <div class="mr-resource__viewer-overlay-details__close">
                                <a class="mr-resource__viewer-overlay-details__close-link" 
                                    (click)="lb.eventHandler.emitOuter('overlaycloseclick')">
                                    <span class="n7-icon-close"></span>
                                </a>
                            </div>
                            <n7-item-preview 
                                [data]="viewerDetailsData" 
                                [emit]="lb.widgets[section.id + '-overlay-details'].emit">
                            </n7-item-preview>
                        </div>
                    </ng-template>

                </ng-container>
    
                <!-- METADATA VIEWER -->
                <ng-container *ngSwitchCase="'metadata'">
                    
                    <div class="mr-content-block mr-content-block-metadata">
                        <h3 *ngIf="section.title" class="mr-content-block__title">
                            {{ section.title }}
                        </h3>
                        <div class="mr-content-block__content">
                            <mr-read-more [data]="section.readmore">
                                <ng-container *ngIf=" section?.options?.readmore || section?.options?.groupReadmore;
                                            else wihoutReadmore">
                                    <mr-metadata-readmore
                                        [data]="lb.widgets[section.id].ds.out$ | async"
                                        [emit]="lb.widgets[section.id].emit">
                                    </mr-metadata-readmore>
                                </ng-container>
                                <ng-template #wihoutReadmore>
                                    <n7-metadata-viewer
                                        [data]="lb.widgets[section.id].ds.out$ | async"
                                        [emit]="lb.widgets[section.id].emit">
                                    </n7-metadata-viewer>
                                </ng-template>
                            </mr-read-more>
                        </div>
                    </div>
      
                </ng-container>
                    
                <!-- METADATA DYNAMIC -->
                <ng-container *ngSwitchCase="'metadata-dynamic'">
                    <mr-metadata-dynamic 
                    [data]="lb.widgets[section.id].ds.out$ | async"
                    [emit]="lb.widgets[section.id].emit">
                    </mr-metadata-dynamic>                    
                </ng-container>
    
                <!-- COLLECTION -->
                <ng-container *ngSwitchCase="'collection'">
                    <ng-container *ngIf="lb.widgets[section.id].ds.out$ | async as collection$">
                        <div *ngIf="collection$.items?.length > 0" class="mr-content-block mr-content-block-collection">
                            <h3 *ngIf="section.title" class="mr-content-block__title">
                                {{ section.title }}
                            </h3>
                            <div class="mr-content-block__content {{ section.grid ? 'n7-grid-' + section.grid : '' }}">
                                <n7-item-preview *ngFor="let item of collection$?.items"
                                    [data]="item" [emit]="lb.widgets[section.id].emit">
                                </n7-item-preview>
                            </div>
                        </div>
                    </ng-container>
                </ng-container>
    
                <!-- ITEM PREVIEW -->
                <ng-container *ngSwitchCase="'preview'">
                    <div class="mr-content-block mr-content-block-item-preview">
                        <h3 *ngIf="section.title" class="mr-content-block__title">
                            {{ section.title }}
                        </h3>
                        <div class="mr-content-block__content">
                            <n7-item-preview [data]="lb.widgets[section.id].ds.out$ | async" [emit]="lb.widgets[section.id].emit">        
                            </n7-item-preview>
                        </div>
                    </div>
                </ng-container>
    
                <!-- TEXT VIEWER -->
                <ng-container *ngSwitchCase="'text-viewer'">
                  <div class="mr-content-block mr-content-block-text-viewer">
                        <h3 *ngIf="section.title" class="mr-content-block__title">
                            {{ section.title }}
                        </h3>
                        <div class="mr-content-block__content">
                          <n7-text-viewer [data]="lb.widgets[section.id].ds.out$ | async" [emit]="lb.widgets[section.id].emit">
                          </n7-text-viewer>
                    </div>
                  </div>
                  
                </ng-container>

                <!-- MAP -->
             <ng-container *ngSwitchCase="'map'">
                  <div class="mr-content-block mr-content-block-map">
                    <div class="mr-content-block__content">
                        <n7-map [data]="lb.widgets[section.id].ds.out$ | async" [emit]="lb.widgets[section.id].emit"></n7-map>
                    </div>
                </div>
            </ng-container>
    
                <!-- INFO BOX -->
                <ng-container *ngSwitchCase="'info-box'">
                    <div class="mr-content-block mr-content-block-info-box">
                        <h3 *ngIf="section.title" class="mr-content-block__title">
                            {{ section.title }}
                        </h3>
                        <div class="mr-content-block__content">
                            <div class="info-box__mock">info-box</div>    
                        </div>
                    </div>
                </ng-container>
    
                <!-- BREADCRUMBS -->
                <ng-container *ngSwitchCase="'breadcrumbs'">
                    <n7-breadcrumbs [data]="lb.widgets[section.id].ds.out$ | async">
                    </n7-breadcrumbs>
                </ng-container>

            </ng-container>
        </section>
    </ng-container>
</ng-template>
