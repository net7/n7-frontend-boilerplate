<div *ngIf="form.loaded$ | async" class="mr-form {{ group?.classes || '' }}">
    <div *ngFor="let section of sections" class="mr-form__section {{ section.classes || '' }}" 
         [ngClass]="{ 'mr-form__section-advanced' : section.advancedSection  }" >
        
        <div class="mr-form__section-header">
            <h3 *ngIf="section.title" class="mr-form__section-title">
                {{ section.title }}
                <span *ngIf="section.info" class="mr-input-info n7-icon n7-icon-info-circle" [attr.alt]="section.info"></span>
            </h3>
            <p *ngIf="section.description" class="mr-form__section-description">{{ section.description }}</p>
        </div>
        
        <div class="mr-form__section-content">
            <div *ngFor="let input of section.inputs" class="mr-form__element {{ input.options?.classes || '' }}">
                <ng-container [ngSwitch]="input.type">

                    <!-- INPUT TEXT -->
                    <n7-input-text *ngSwitchCase="'text'" 
                        [data]="form.inputs[input.id].ds.out$ | async"
                        [emit]="form.inputs[input.id].emit"></n7-input-text>

                    <!-- INPUT CHECKBOX -->
                    <n7-input-checkbox *ngSwitchCase="'checkbox'" 
                        [data]="form.inputs[input.id].ds.out$ | async"
                        [emit]="form.inputs[input.id].emit"></n7-input-checkbox>

                    <!-- INPUT SELECT -->
                    <n7-input-select *ngSwitchCase="'select'"
                        [data]="form.inputs[input.id].ds.out$ | async"
                        [emit]="form.inputs[input.id].emit"></n7-input-select>

                    <!-- INPUT TYPEAHEAD -->
                    <mr-input-typeahead *ngSwitchCase="'typeahead'"
                        [data]="form.inputs[input.id].ds.out$ | async"
                        [emit]="form.inputs[input.id].emit"></mr-input-typeahead>

                    <!-- DEFAULT (external template) -->
                    <ng-container *ngSwitchDefault>
                        <ng-template *ngTemplateOutlet="
                        templateRef; 
                        context: { 
                            type: input.type, 
                            input: form.inputs[input.id] 
                        }"></ng-template>
                    </ng-container>

                </ng-container>
            </div>
        </div>
    </div>
</div>
