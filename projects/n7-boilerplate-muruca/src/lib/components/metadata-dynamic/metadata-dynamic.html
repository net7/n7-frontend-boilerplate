<ng-container *ngIf="data.data">
  <ng-container *ngFor="let group of data.data; index as i">
    <ng-container *ngTemplateOutlet="metadataViewer; context:{$implicit: group}"></ng-container>
  </ng-container>
</ng-container>

<ng-template #metadataViewer let-group>
  <div class="mr-content-block mr-content-block-metadata">
    <div *ngIf="group" class="mr-metadata-dynamic" [ngClass]="{'mr-metadata-dynamic-accordion' : group.title}">
      
      <!-- Header accordion (se presente) -->
      <div *ngIf="group.options && (group.options.showHeader !== false) && group.title" class="mr-metadata-dynamic-accordion__header">
        <n7-facet-header 
          [data]="group.options" 
          [emit]="fakeEmit"
        ></n7-facet-header>
      </div>

      <!-- Content -->
      <div *ngIf="group.options.isOpen" class="mr-content-block__content" [attr.id]="group.id">
        <mr-read-more [data]="group.readmore">
          <ng-container *ngIf=" group?.options?.readmore || group?.options?.groupReadmore;
                      else wihoutReadmore">
            <mr-metadata-readmore
                [data]="obtainData(group)">
            </mr-metadata-readmore>
          </ng-container>
          <ng-template #wihoutReadmore>
            <n7-metadata-viewer
                [data]="obtainData(group)">
            </n7-metadata-viewer>
          </ng-template>
        </mr-read-more>
      </div>

    </div>
  </div>
</ng-template>
