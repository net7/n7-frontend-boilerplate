<div *ngIf="data"
     class="n7-metadata-viewer">
    <!-- Metadata groups wrapper -->
    <div class="n7-metadata-viewer__wrapper {{ data.classes  || ''}}"
         *ngFor="let grp of data.group">
        <!-- For each data group, render it -->
        <ng-container *ngTemplateOutlet="group; context:{$implicit: grp}"></ng-container>
    </div>
</div>

<!-- Template for Metadata.group -->
<ng-template #group
             let-grp>
    <div *ngIf="grp.title || grp.items"
         class="n7-metadata-viewer__group {{ grp.classes || '' }}">
        <div class="n7-metadata-viewer__group-title"
             *ngIf="grp.title">{{grp.title}}</div>
        <div class="n7-metadata-viewer__group-content"
             *ngIf="grp.items">
            <!-- "read more" enabled on the metadata group -->
            <mr-read-more [data]="grp.groupReadmore">
                <div class="n7-metadata-viewer__item"
                    *ngFor="let i of grp.items">
                    <span *ngIf="i.label" class="n7-metadata-viewer__item-label">
                        {{ i.label }}
                    </span>
                    <!-- "read more" enabled on the metadata value field -->
                    <mr-read-more [data]="grp.readmore">
                        <span *ngIf="i.value"
                            class="n7-metadata-viewer__item-value"
                            [innerHTML]="i.value">
                        </span>
                    </mr-read-more>
                </div>
            </mr-read-more>
        </div>
    </div>
    <!-- Render all child groups -->
    <div *ngIf="grp.group">
        <div class="n7-metadata-viewer__group-wrapper"
             *ngFor="let grp of grp.group">
            <ng-container *ngTemplateOutlet="group; context:{$implicit: grp}"></ng-container>
        </div>
    </div>
</ng-template>
