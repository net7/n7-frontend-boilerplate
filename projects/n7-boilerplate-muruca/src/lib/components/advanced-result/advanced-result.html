<div *ngIf="data"
     class="mr-advanced-result">
     <!-- RESULT MAIN CONTENT -->
    <n7-item-preview [data]="data"></n7-item-preview>
    <!-- RESULT HIGHLIGHTS SECTION -->
    <ng-container *ngIf="hasHighlights()">
        <div *ngIf="data?.highlightsTitle" class="mr-advanced-result__header"
        [ngClass]="{
            'has-toggle': !!data.highlightsHasToggle
        }"
        (click)="onHeaderClick(data)">
            <span class="mr-advanced-result__header-label">
                {{ data.highlightsTitle }}
            </span>
            <span class="mr-advanced-result__header-icon"
            [ngClass]="{
                'n7-icon-angle-down': data.highlightsHidden,
                'n7-icon-angle-up': !data.highlightsHidden
            }">
            </span>
        </div>
        <div [hidden]="isHidden()" 
        class="mr-advanced-result__content"
            *ngFor="let highlightGroup of data.highlights">
            <div class="mr-advanced-result__content-group">
                <!-- METADATA ITEM -->
                <div class="mr-advanced-result__item {{ item.classes || '' }}"
                    *ngFor="let item of highlightGroup.items">
                    <!-- ICON -->
                    <span class="mr-advanced-result__icon {{item.icon}}"
                        *ngIf="item.icon">
                    </span>
                    <!-- LABEL -->
                    <span class="mr-advanced-result__label"
                        *ngIf="item.label"
                        [innerHTML]="item.label">
                    </span>
                    <!-- VALUE W/ HREF -->
                    <a *ngIf="item.href"
                    [href]="item.href"
                    [target]="item.target"
                    >
                        <span class="mr-advanced-result__value"
                            *ngIf="item.value"
                            [innerHTML]="item.value">
                        </span>
                    </a>
                    <!-- VALUE W/OUT HREF -->
                    <span class="mr-advanced-result__value"
                        *ngIf="item.value && !item.href"
                        [innerHTML]="item.value">
                    </span>
                </div>
            </div>
        </div>
    </ng-container>
</div>
