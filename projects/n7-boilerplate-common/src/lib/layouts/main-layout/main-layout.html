<div class="n7-main-layout" id="main-layout">
    <div class="n7-page-content">
        <n7-header
            [data]="lb.widgets['header'].ds.out$ | async"
            [emit]="lb.widgets['header'].emit">
        </n7-header>
        <main class="n7-content">
            <div class="n7-top-page-bar">
                <div class="n7-top-page-bar__main"></div>
            </div>
            <div class="n7-alert-bar">
                <!--<n7-alert
                [attr.id]="'main-layout-alert'"
                [data]="lb.dataSource.alertData$ | async"
                [emit]="lb.dataSource.closeAlert.bind(lb.dataSource)"></n7-alert>-->
            </div>
            <ng-content></ng-content>
        </main>
    </div>
    <n7-footer
        [data]="lb.widgets['footer'].ds.out$ | async"
        [emit]="lb.widgets['footer'].emit">
    </n7-footer>
</div>
